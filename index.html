<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noppo Direct Transfer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap');
        
        :root {
            --noppo-blue: #0066FF;
            --noppo-bg: #F8FAFC;
            --noppo-accent: rgba(0, 102, 255, 0.05);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--noppo-bg);
            color: #0F172A;
            letter-spacing: -0.025em;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 102, 255, 0.03) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 102, 255, 0.03) 0px, transparent 50%);
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Premium Glassmorphism */
        .n-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 50, 150, 0.04);
            border-radius: 40px;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .n-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 20px 60px rgba(0, 50, 150, 0.08);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .n-input {
            background: rgba(241, 245, 249, 0.8);
            border: 2px solid transparent;
            border-radius: 24px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            font-weight: 600;
        }

        .n-input:focus {
            background: #FFFFFF;
            border-color: var(--noppo-blue);
            box-shadow: 0 0 0 8px rgba(0, 102, 255, 0.06);
        }

        /* Animated Progress */
        .progress-container {
            height: 8px;
            background: rgba(241, 245, 249, 1);
            border-radius: 100px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0066FF, #3B82F6);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 100px;
        }

        /* Buttons */
        .btn-primary {
            background: var(--noppo-blue);
            color: white;
            border-radius: 24px;
            font-weight: 800;
            box-shadow: 0 12px 24px -6px rgba(0, 102, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 20px 40px -10px rgba(0, 102, 255, 0.4);
        }
        .btn-primary:active {
            transform: scale(0.96);
        }

        .btn-secondary {
            background: #F1F5F9;
            color: #64748B;
            border-radius: 20px;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-secondary:hover {
            background: #E2E8F0;
            color: #0F172A;
        }

        /* Drop Zone Special */
        .drop-zone {
            border: 2px dashed rgba(226, 232, 240, 1);
            background: rgba(255, 255, 255, 0.4);
            border-radius: 48px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .drop-zone.active {
            border-color: var(--noppo-blue);
            background: rgba(240, 249, 255, 0.8);
            transform: scale(0.98);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-up { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="sticky top-0 z-50 px-8 py-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-5">
                <div class="w-12 h-12 bg-[#0066FF] rounded-[18px] flex items-center justify-center text-white shadow-xl shadow-blue-200/50">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tighter leading-none mb-1">Noppo <span class="text-[#0066FF]">DT</span></h1>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] opacity-80">Direct Transfer Pro</p>
                </div>
            </div>

            <div class="flex items-center gap-8">
                <div class="hidden sm:block text-right">
                    <p id="user-name" class="text-sm font-extrabold text-slate-800">Guest</p>
                    <div class="flex items-center justify-end gap-1.5">
                        <div id="auth-indicator" class="w-1.5 h-1.5 rounded-full bg-slate-300"></div>
                        <p id="user-status" class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Offline</p>
                    </div>
                </div>
                <button id="auth-btn" onclick="handleAuthAction()" class="bg-slate-900 text-white px-7 py-3 rounded-2xl text-xs font-black hover:bg-black transition-all active:scale-95 shadow-lg shadow-slate-200">
                    ログイン
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto w-full p-8 flex-grow">
        <!-- Hero ID Section -->
        <section class="mb-12 text-center animate-up">
            <h3 class="text-[11px] font-black text-slate-400 uppercase tracking-[0.3em] mb-4">Your Device Identity</h3>
            <div class="inline-flex items-center gap-6 px-10 py-5 bg-white rounded-[32px] shadow-sm border border-slate-100">
                <div id="my-peer-id" class="mono text-2xl font-bold text-slate-800 tracking-tight">Connecting...</div>
                <div class="h-6 w-[1px] bg-slate-200"></div>
                <div class="flex gap-2">
                    <button onclick="copyId()" class="p-2 text-slate-400 hover:text-blue-600 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                    </button>
                    <button onclick="showQR()" class="p-2 text-slate-400 hover:text-blue-600 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v.01"/></svg>
                    </button>
                </div>
            </div>
        </section>

        <!-- Main Interaction Area -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-12">
            <!-- Connection Panel -->
            <div class="n-card p-10 animate-up" style="animation-delay: 0.1s">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="text-[11px] font-black text-slate-400 uppercase tracking-[0.25em]">Establish Link</h3>
                    <div id="conn-status" class="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-full">
                        <div id="status-dot" class="w-2 h-2 rounded-full bg-slate-300"></div>
                        <span id="status-text" class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Disconnected</span>
                    </div>
                </div>
                <div class="space-y-6">
                    <div class="relative">
                        <input type="text" id="target-id" placeholder="相手のDevice IDを入力" class="n-input w-full px-7 py-5 text-sm outline-none">
                        <button onclick="openScan()" class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-blue-600 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 7h1"/><path d="M7 12h10"/><path d="M7 17h10"/><path d="M12 7h5"/></svg>
                        </button>
                    </div>
                    <button id="conn-btn" onclick="startConnect()" class="btn-primary w-full py-5 text-sm uppercase tracking-[0.15em]">
                        Connect Device
                    </button>
                </div>
            </div>

            <!-- Transfer Panel -->
            <div id="drop-zone" class="n-card p-4 drop-zone animate-up" style="animation-delay: 0.2s">
                <div class="bg-white/40 border border-white/60 rounded-[36px] h-full p-10 flex flex-col items-center justify-center text-center gap-6">
                    <div id="drop-icon" class="w-20 h-20 bg-white rounded-3xl flex items-center justify-center text-slate-200 shadow-sm transition-all duration-500">
                        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                    </div>
                    <div>
                        <h2 class="text-xl font-extrabold mb-1 tracking-tight">Drop & Send</h2>
                        <p class="text-slate-400 text-xs font-medium leading-relaxed max-w-[200px]">ファイルをドラッグするか、ボタンで選択</p>
                    </div>
                    <input type="file" id="file-input" class="hidden" multiple>
                    <button onclick="document.getElementById('file-input').click()" class="bg-slate-900 text-white px-8 py-3.5 rounded-2xl font-black text-xs hover:bg-black transition-all active:scale-95 shadow-xl shadow-slate-200 uppercase tracking-widest">
                        Select Files
                    </button>
                </div>
            </div>
        </div>

        <!-- Transfer List Section -->
        <section class="animate-up" style="animation-delay: 0.3s">
            <div class="flex justify-between items-center mb-6 px-4">
                <h3 class="text-[11px] font-black text-slate-400 uppercase tracking-[0.3em]">Live Transfers</h3>
                <button onclick="clearLogs()" class="text-[10px] font-black text-slate-400 hover:text-blue-600 transition-colors uppercase tracking-widest">Clear Completed</button>
            </div>
            <div id="transfer-list" class="space-y-4">
                <div id="empty-hint" class="py-24 text-center border-2 border-dashed border-slate-100 rounded-[40px] bg-white/30">
                    <p class="text-[11px] font-black text-slate-300 uppercase tracking-[0.4em]">Waiting for data...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer Information -->
    <footer class="p-10 text-center opacity-40">
        <p class="text-[10px] font-black uppercase tracking-[0.5em] text-slate-400">P2P Encrypted Channel</p>
    </footer>

    <!-- QR Modal -->
    <div id="modal-qr" class="fixed inset-0 bg-slate-900/10 backdrop-blur-2xl z-[100] hidden items-center justify-center p-6" onclick="closeModal('modal-qr')">
        <div class="bg-white rounded-[56px] p-12 max-w-sm w-full shadow-2xl animate-up" onclick="event.stopPropagation()">
            <div class="flex flex-col items-center text-center">
                <div class="w-16 h-1.5 bg-slate-100 rounded-full mb-10"></div>
                <h4 class="font-black text-2xl mb-4 tracking-tight">Device QR</h4>
                <p class="text-sm text-slate-400 mb-10 font-medium leading-relaxed px-6">スマホでスキャンして、リンクを開始します</p>
                <div id="qrcode" class="p-8 bg-slate-50 rounded-[48px] mb-10 border border-slate-100"></div>
                <button onclick="closeModal('modal-qr')" class="w-full btn-primary py-5 text-sm uppercase tracking-widest">Close</button>
            </div>
        </div>
    </div>

    <!-- Scan Modal -->
    <div id="modal-scan" class="fixed inset-0 bg-black/90 backdrop-blur-xl z-[100] hidden flex-col items-center justify-center p-8" onclick="closeScan()">
        <div id="reader" class="w-full max-w-lg aspect-square overflow-hidden rounded-[56px] border-8 border-white/10 shadow-2xl"></div>
        <div class="mt-12 flex flex-col items-center gap-4">
            <h5 class="text-white text-lg font-bold tracking-tight">QR Scanner</h5>
            <button onclick="closeScan()" class="bg-white/10 text-white px-10 py-4 rounded-3xl font-black text-xs uppercase tracking-widest border border-white/20 hover:bg-white/20 transition-all">Cancel</button>
        </div>
    </div>

    <script>
        const AUTH_WORKER = "https://noppo-auth.noppo5319.workers.dev";
        const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2YXZhc3JkeGd1cWtpaWdjeGtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0MTk5ODcsImV4cCI6MjA4Mjk5NTk4N30.CVq3lyRbxek7Ejs4tP5sN9-0JNEXSLtCsC2Pj-skFFQ";
        const CHUNK_SIZE = 64 * 1024; // 64KB

        let peer = null;
        let activeConn = null;
        let currentUser = null;
        let receivingFiles = {};

        // --- Auth Logic ---
        async function loadUser() {
            const ticket = new URLSearchParams(window.location.search).get('ticket');
            const cached = localStorage.getItem('noppo_user');
            if (cached) currentUser = JSON.parse(cached);

            try {
                const url = ticket ? `${AUTH_WORKER}/auth/v1/user?ticket=${ticket}` : `${AUTH_WORKER}/auth/v1/user`;
                const res = await fetch(url, { headers: { "apikey": API_KEY } });
                
                if (res.ok) {
                    currentUser = await res.json();
                    localStorage.setItem('noppo_user', JSON.stringify(currentUser));
                    if (ticket) history.replaceState({}, "", window.location.origin + window.location.pathname);
                }
            } catch (e) {
                console.error("Auth sync error:", e);
            }

            if (currentUser) {
                const name = currentUser.user_metadata?.display_name || currentUser.email.split('@')[0];
                updateUserUI(name, true);
                setupPeer(name);
            } else {
                updateUserUI("Guest", false);
                setupPeer(null);
            }
        }

        function updateUserUI(name, loggedIn) {
            document.getElementById('user-name').innerText = name;
            document.getElementById('user-status').innerText = loggedIn ? 'Account Linked' : 'Offline';
            document.getElementById('auth-btn').innerText = loggedIn ? 'ログアウト' : 'ログイン';
            const indicator = document.getElementById('auth-indicator');
            if (loggedIn) {
                indicator.className = "w-1.5 h-1.5 rounded-full bg-blue-500 shadow-sm";
                document.getElementById('user-status').classList.replace('text-slate-400', 'text-blue-500');
            }
        }

        function handleAuthAction() {
            if (currentUser) {
                localStorage.removeItem('noppo_user');
                window.location.href = `${AUTH_WORKER}/logout?redirect=${encodeURIComponent(window.location.href)}`;
            } else {
                window.location.href = `${AUTH_WORKER}?redirect=${encodeURIComponent(window.location.href)}`;
            }
        }

        // --- PeerJS Logic ---
        function setupPeer(name, suffix = "") {
            const id = name ? `noppo-${name}${suffix}` : null;
            if (peer) peer.destroy();

            peer = new Peer(id, {
                debug: 1,
                config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', id => {
                document.getElementById('my-peer-id').innerText = id;
                generateQR(id);
                updateConnStatus("Ready to connect", false);
            });

            peer.on('connection', conn => {
                if (activeConn && activeConn.open) return conn.close();
                activeConn = conn;
                handleConnection(conn);
            });

            peer.on('error', err => {
                if (err.type === 'unavailable-id') {
                    setupPeer(name, "-" + Math.floor(1000 + Math.random() * 9000));
                }
                updateConnStatus("Error: " + err.type, false);
            });
        }

        function startConnect() {
            const tid = document.getElementById('target-id').value.trim();
            if (!tid || !peer.open) return;
            updateConnStatus("Establishing Link...", true);
            const conn = peer.connect(tid, { reliable: true });
            activeConn = conn;
            handleConnection(conn);
        }

        function handleConnection(conn) {
            conn.on('open', () => {
                updateConnStatus(`Linked: ${conn.peer}`, true);
                const icon = document.getElementById('drop-icon');
                icon.className = "w-20 h-20 bg-blue-50 rounded-3xl flex items-center justify-center text-blue-500 shadow-xl shadow-blue-100/50";
            });

            conn.on('data', data => {
                if (data.type === 'file-start') {
                    receivingFiles[data.fileId] = { chunks: [], total: data.totalChunks, received: 0, name: data.name, mime: data.mime };
                    addProgressUI(data.fileId, data.name, 'receiving');
                } else if (data.type === 'file-chunk') {
                    const info = receivingFiles[data.fileId];
                    if (!info) return;
                    info.chunks[data.index] = data.chunk;
                    info.received++;
                    const pct = Math.floor((info.received / info.total) * 100);
                    updateProgressUI(data.fileId, pct, `Receiving ${pct}%`);
                    if (info.received === info.total) finalizeDownload(data.fileId);
                }
            });

            conn.on('close', () => {
                updateConnStatus("Disconnected", false);
                document.getElementById('drop-icon').className = "w-20 h-20 bg-white rounded-3xl flex items-center justify-center text-slate-200 shadow-sm";
                activeConn = null;
            });
        }

        // --- Chunked Transfer ---
        async function sendFiles(files) {
            if (!activeConn || !activeConn.open) return;
            const hint = document.getElementById('empty-hint');
            if (hint) hint.remove();

            for (const file of files) {
                const fileId = 'f' + Date.now() + Math.floor(Math.random() * 1000);
                const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
                addProgressUI(fileId, file.name, 'sending');
                
                activeConn.send({ type: 'file-start', fileId, name: file.name, mime: file.type, totalChunks });

                for (let i = 0; i < totalChunks; i++) {
                    const start = i * CHUNK_SIZE;
                    const chunk = await file.slice(start, start + CHUNK_SIZE).arrayBuffer();
                    activeConn.send({ type: 'file-chunk', fileId, index: i, chunk });
                    
                    if (i % 8 === 0 || i === totalChunks - 1) {
                        const pct = Math.floor(((i + 1) / totalChunks) * 100);
                        updateProgressUI(fileId, pct, `Sending ${pct}%`);
                    }
                    if (i % 15 === 0) await new Promise(r => setTimeout(r, 10));
                }
                updateProgressUI(fileId, 100, "Done");
            }
        }

        function finalizeDownload(fileId) {
            const info = receivingFiles[fileId];
            const blob = new Blob(info.chunks, { type: info.mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = info.name;
            a.click();
            updateProgressUI(fileId, 100, "Saved");
            delete receivingFiles[fileId];
        }

        // --- UI Utils ---
        function updateConnStatus(text, active) {
            document.getElementById('status-text').innerText = text;
            const dot = document.getElementById('status-dot');
            dot.className = `w-2 h-2 rounded-full transition-all duration-500 ${active ? 'bg-blue-500 shadow-lg shadow-blue-200 animate-pulse' : 'bg-slate-300'}`;
        }

        function addProgressUI(id, name, mode) {
            const hint = document.getElementById('empty-hint');
            if (hint) hint.remove();

            const html = `
                <div id="${id}" class="n-card p-8 animate-up">
                    <div class="flex justify-between items-center mb-6">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-2xl ${mode === 'sending' ? 'bg-blue-50 text-blue-500' : 'bg-emerald-50 text-emerald-500'} flex items-center justify-center">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="${mode === 'sending' ? 'm5 12 7-7 7 7M12 19V5' : 'm19 12-7 7-7-7M12 5v14'}"/></svg>
                            </div>
                            <div class="min-w-0">
                                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-0.5">${mode === 'sending' ? 'Outgoing' : 'Incoming'}</p>
                                <p class="text-sm font-bold text-slate-700 truncate max-w-[180px] sm:max-w-xs">${name}</p>
                            </div>
                        </div>
                        <span id="${id}-stat" class="text-[9px] font-black text-slate-400 uppercase tracking-widest bg-slate-50 px-3 py-1.5 rounded-lg">Pending</span>
                    </div>
                    <div class="progress-container"><div id="${id}-bar" class="progress-fill"></div></div>
                </div>`;
            document.getElementById('transfer-list').insertAdjacentHTML('afterbegin', html);
        }

        function updateProgressUI(id, pct, text) {
            const bar = document.getElementById(`${id}-bar`);
            const stat = document.getElementById(`${id}-stat`);
            if (bar) bar.style.width = pct + '%';
            if (stat) stat.innerText = text;
            if (pct === 100) stat.classList.add('text-blue-600', 'bg-blue-50');
        }

        function generateQR(text) {
            const el = document.getElementById("qrcode");
            el.innerHTML = "";
            new QRCode(el, { text, width: 220, height: 220, colorDark: "#0f172a", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
        }

        function showQR() { document.getElementById('modal-qr').classList.replace('hidden', 'flex'); }
        function closeModal(id) { document.getElementById(id).classList.replace('flex', 'hidden'); }

        function copyId() {
            const id = document.getElementById('my-peer-id').innerText;
            if (id !== "Connecting...") navigator.clipboard.writeText(id);
        }

        function clearLogs() {
            const list = document.getElementById('transfer-list');
            const items = list.querySelectorAll('.n-card');
            items.forEach(item => {
                const stat = item.querySelector('[id$="-stat"]').innerText;
                if (stat === "DONE" || stat === "SAVED") item.remove();
            });
            if (list.children.length === 0) {
                list.innerHTML = `<div id="empty-hint" class="py-24 text-center border-2 border-dashed border-slate-100 rounded-[40px] bg-white/30">
                    <p class="text-[11px] font-black text-slate-300 uppercase tracking-[0.4em]">Waiting for data...</p>
                </div>`;
            }
        }

        function openScan() {
            document.getElementById('modal-scan').classList.replace('hidden', 'flex');
            qrScanner = new Html5Qrcode("reader");
            qrScanner.start({ facingMode: "environment" }, { fps: 20, qrbox: 280 }, (text) => {
                document.getElementById('target-id').value = text;
                closeScan();
                startConnect();
            }).catch(() => closeScan());
        }

        function closeScan() {
            if (typeof qrScanner !== 'undefined' && qrScanner) {
                qrScanner.stop().finally(() => {
                    document.getElementById('modal-scan').classList.replace('flex', 'hidden');
                    qrScanner = null;
                });
            } else {
                document.getElementById('modal-scan').classList.replace('flex', 'hidden');
            }
        }

        // --- Drag & Drop ---
        const dz = document.getElementById('drop-zone');
        dz.ondragover = e => { e.preventDefault(); dz.classList.add('active'); };
        dz.ondragleave = () => dz.classList.remove('active');
        dz.ondrop = e => { e.preventDefault(); dz.classList.remove('active'); sendFiles(e.dataTransfer.files); };
        document.getElementById('file-input').onchange = e => sendFiles(e.target.files);

        window.onload = loadUser;
    </script>
</body>
</html>
