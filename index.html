<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noppo Direct Transfer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap');
        
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        .drop-zone {
            border: 2px dashed #e2e8f0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .drop-zone.active {
            border-color: #3b82f6;
            background-color: #eff6ff;
            transform: scale(0.98);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes progress-shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .progress-fill {
            background: linear-gradient(90deg, #3b82f6 25%, #60a5fa 50%, #3b82f6 75%);
            background-size: 200% 100%;
            animation: progress-shimmer 2s infinite linear;
        }

        @media (max-width: 640px) {
            .tab-content { display: none; }
            .tab-content.active { display: block; }
        }
    </style>
</head>
<body class="bg-[#F8FAFC] min-h-screen pb-20 sm:pb-0">

    <!-- Header -->
    <header class="sticky top-0 z-40 w-full glass-card border-b border-slate-200 px-4 py-3 sm:px-8">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-1.5 rounded-lg shadow-blue-200 shadow-lg text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m16 13 5.23 3.48a2 2 0 0 1 0 3.32L16 23.27a2 2 0 0 1-3-1.66V18.73a2 2 0 0 1 3-1.66Z"/><path d="M21 13V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8"/></svg>
                </div>
                <h1 class="text-lg font-extrabold tracking-tight text-slate-900 hidden sm:block">Noppo <span class="text-blue-600">DT</span></h1>
            </div>

            <div id="auth-area" class="flex items-center gap-3">
                <!-- ユーザー名表示: スマホでも見えるように hidden sm:flex を flex に変更 -->
                <div id="user-info" class="flex flex-col items-end leading-none">
                    <span id="user-display-name" class="text-xs font-bold text-slate-900">ゲスト</span>
                    <span id="login-perk" class="text-[9px] text-slate-400 font-medium">ログインで機能を解放</span>
                </div>
                <button id="login-btn" onclick="goToLogin()" class="bg-slate-900 text-white text-xs px-4 py-2 rounded-full font-bold hover:bg-slate-800 transition active:scale-95 shadow-md">
                    ログイン
                </button>
                <button id="logout-btn" onclick="logout()" class="hidden p-2 text-slate-400 hover:text-red-500 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 sm:p-8">
        
        <!-- Mobile Tabs -->
        <div class="flex sm:hidden bg-white p-1 rounded-xl mb-6 shadow-sm border">
            <button onclick="switchTab('transfer')" id="tab-btn-transfer" class="flex-1 py-2 text-sm font-bold rounded-lg bg-blue-600 text-white">転送</button>
            <button onclick="switchTab('history')" id="tab-btn-history" class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-400">履歴</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Column: Connection -->
            <div id="tab-transfer" class="lg:col-span-7 space-y-6 tab-content active">
                
                <!-- My ID Card (Fixed Layout) -->
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 relative overflow-hidden group">
                    <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3">Your Transfer ID</h2>
                    <div class="flex items-center justify-between gap-4">
                        <button onclick="copyMyId()" class="flex-1 min-w-0 flex flex-col items-start group/btn">
                            <span id="my-peer-id" class="mono text-xl sm:text-2xl font-bold text-slate-800 break-all text-left">...</span>
                            <span class="text-[10px] text-blue-500 font-bold opacity-100 sm:opacity-0 group-hover/btn:opacity-100 transition-opacity mt-1">コピーする</span>
                        </button>
                        <!-- ボタンが重ならないよう z-index と配置を調整 -->
                        <button onclick="showMyQR()" class="flex-shrink-0 z-10 p-4 bg-blue-50 text-blue-600 rounded-2xl hover:bg-blue-100 transition shadow-sm active:scale-90 border border-blue-100">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3"/><path d="M12 14v3"/><path d="M7 12h3"/><path d="M14 12h3"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Connect Card -->
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
                    <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4">Connect to Device</h2>
                    <div class="space-y-3">
                        <div class="relative">
                            <input type="text" id="remote-peer-id" placeholder="相手のIDを入力..." class="w-full bg-slate-50 border-none rounded-2xl px-5 py-4 text-sm font-bold focus:ring-2 focus:ring-blue-500 transition outline-none">
                            <button onclick="openScanner()" class="absolute right-3 top-1/2 -translate-y-1/2 p-2 text-slate-400 hover:text-blue-500 transition">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                        <button id="connect-btn" onclick="connectToPeer()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-100 active:scale-[0.98]">
                            接続する
                        </button>
                        <p id="connection-status" class="text-center text-[11px] font-bold text-slate-400 italic">Ready for connection</p>
                    </div>
                </div>

                <!-- Transfer Drop Zone -->
                <section id="transfer-section" class="hidden opacity-0 scale-95 transition-all duration-500">
                    <div id="drop-zone" class="drop-zone bg-white rounded-[2rem] p-10 flex flex-col items-center justify-center gap-4 shadow-sm">
                        <div class="w-20 h-20 bg-blue-600 text-white rounded-3xl flex items-center justify-center shadow-xl shadow-blue-100 animate-bounce">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                        </div>
                        <div class="text-center">
                            <p class="text-xl font-black text-slate-900">ファイルをドロップ</p>
                            <p class="text-slate-400 text-sm font-medium">デバイスへ直接転送します</p>
                        </div>
                        <input type="file" id="file-input" class="hidden" multiple>
                        <button onclick="document.getElementById('file-input').click()" class="mt-2 px-8 py-3 bg-slate-900 text-white rounded-2xl font-bold hover:bg-black transition active:scale-95 shadow-lg">ファイルを選択</button>
                    </div>
                </section>
            </div>

            <!-- Right Column: Logs & Progress -->
            <div id="tab-history" class="lg:col-span-5 space-y-6 tab-content">
                <div id="progress-container" class="hidden space-y-3">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Active Transfer</h3>
                    <div id="active-transfers" class="space-y-3"></div>
                </div>

                <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex flex-col h-full max-h-[500px] lg:max-h-[600px]">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Activity Log</h3>
                        <button onclick="clearLogs()" class="text-[10px] text-blue-500 font-bold hover:underline">Clear</button>
                    </div>
                    <div id="logs" class="space-y-2 overflow-y-auto flex-1 pr-2">
                        <div id="empty-log" class="h-32 flex items-center justify-center text-slate-300 text-xs italic font-medium">
                            No recent activity
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modals (QR, Scanner, etc.) -->
    <div id="qr-modal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[100] hidden items-center justify-center p-6" onclick="closeQRModal()">
        <div class="bg-white rounded-[2.5rem] w-full max-w-xs p-8 shadow-2xl scale-90 transition-all duration-300" onclick="event.stopPropagation()">
            <div class="flex flex-col items-center text-center">
                <div class="w-12 h-1.5 bg-slate-100 rounded-full mb-6"></div>
                <h3 class="font-black text-xl mb-2 text-slate-800">Scan to Connect</h3>
                <p class="text-[10px] text-slate-400 font-bold mb-6">このコードを相手のカメラで読み取ってください</p>
                <div id="qrcode-container" class="bg-white p-4 border-4 border-slate-50 rounded-3xl mb-8"></div>
                <button onclick="closeQRModal()" class="w-full bg-slate-100 text-slate-900 py-4 rounded-2xl font-bold hover:bg-slate-200 transition">閉じる</button>
            </div>
        </div>
    </div>

    <div id="scanner-modal" class="fixed inset-0 bg-black z-[100] hidden flex-col items-center justify-center">
        <div id="reader" class="w-full h-full max-w-md"></div>
        <div class="absolute bottom-10 left-0 right-0 px-8 flex flex-col items-center gap-4">
            <p class="text-white text-xs font-bold bg-white/10 backdrop-blur-md px-6 py-2 rounded-full border border-white/20">相手のQRコードを枠内に収めてください</p>
            <button onclick="closeScanner()" class="w-full max-w-xs bg-red-500/20 text-red-500 border border-red-500/50 py-4 rounded-2xl font-bold backdrop-blur-xl">キャンセル</button>
        </div>
    </div>

    <div id="preview-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-xl z-[100] hidden items-center justify-center p-4 transition-all duration-500 opacity-0">
        <div class="bg-white rounded-[3rem] max-w-sm w-full p-8 shadow-2xl scale-90 transition-all duration-500 text-center">
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <h3 class="font-black text-2xl mb-2 text-slate-900">受信完了！</h3>
            <p id="preview-filename" class="text-slate-400 text-xs font-bold truncate mb-8 px-4"></p>
            <div id="preview-content" class="mb-8 rounded-3xl overflow-hidden border-4 border-slate-50 aspect-video flex items-center justify-center bg-slate-50"></div>
            <button onclick="closePreview()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold shadow-xl active:scale-95 transition">完了</button>
        </div>
    </div>

    <script>
        const AUTH_WORKER_URL = "https://noppo-auth.noppo5319.workers.dev";
        const SUPABASE_URL = "https://vvavasrdxguqkiigcxkl.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2YXZhc3JkeGd1cWtpaWdjeGtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0MTk5ODcsImV4cCI6MjA4Mjk5NTk4N30.CVq3lyRbxek7Ejs4tP5sN9-0JNEXSLtCsC2Pj-skFFQ";

        let peer = null;
        let conn = null;
        let html5QrCode = null;
        let heartbeatInterval = null;

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            document.querySelectorAll('[id^="tab-btn-"]').forEach(el => {
                el.classList.remove('bg-blue-600', 'text-white');
                el.classList.add('text-slate-400');
            });
            document.getElementById(`tab-btn-${tabId}`).classList.remove('text-slate-400');
            document.getElementById(`tab-btn-${tabId}`).classList.add('bg-blue-600', 'text-white');
        }

        async function checkAuth() {
            const params = new URLSearchParams(window.location.search);
            // LINE等のアプリ内ブラウザでのリダイレクト安定化
            const token = params.get('token') || localStorage.getItem('noppo_token');
            
            if (params.get('token')) {
                localStorage.setItem('noppo_token', params.get('token'));
                // URLクエリを削除してクリーンなURLに
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            if (token) {
                try {
                    const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                        headers: { "Authorization": `Bearer ${token}`, "apikey": SUPABASE_KEY }
                    });
                    if (response.ok) {
                        const user = await response.json();
                        const userName = user.email.split('@')[0];
                        document.getElementById('user-display-name').innerText = userName;
                        document.getElementById('login-perk').innerText = "固定ID & P2P最適化";
                        document.getElementById('login-perk').classList.replace('text-slate-400', 'text-green-500');
                        document.getElementById('login-btn').classList.add('hidden');
                        document.getElementById('logout-btn').classList.remove('hidden');
                        initPeer(user.id);
                        return;
                    }
                } catch (e) {
                    addLog("認証エラーが発生しました", "error");
                }
            }
            initPeer(null);
        }

        function initPeer(id) {
            const peerId = id ? `noppo-${id.substring(0, 8)}` : null;
            if (peer) {
                peer.destroy();
                clearInterval(heartbeatInterval);
            }

            peer = new Peer(peerId, { 
                debug: 1,
                config: { 'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ] }
            });

            peer.on('open', (assignedId) => {
                document.getElementById('my-peer-id').innerText = assignedId;
                addLog("システムオンライン");
                
                const qrContainer = document.getElementById("qrcode-container");
                qrContainer.innerHTML = '';
                new QRCode(qrContainer, {
                    text: assignedId,
                    width: 240,
                    height: 240,
                    colorDark : "#0f172a",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
                startHeartbeat();
            });

            peer.on('connection', (connection) => {
                if (conn) conn.close();
                conn = connection;
                setupConnectionListeners();
            });
            
            peer.on('disconnected', () => {
                addLog("再接続を試みています...", "error");
                peer.reconnect();
            });

            peer.on('error', (err) => {
                addLog(`エラー: ${err.type}`, "error");
                if (err.type === 'server-error' || err.type === 'network') {
                    setTimeout(() => initPeer(id), 5000);
                }
            });
        }

        function startHeartbeat() {
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(() => {
                if (peer && !peer.destroyed && peer.socket && peer.socket._open) {
                    peer.socket.send({ type: 'HEARTBEAT' });
                }
            }, 15000);
        }

        function connectToPeer(targetId) {
            const remoteId = targetId || document.getElementById('remote-peer-id').value.trim();
            if (!remoteId) return;
            addLog("接続中...");
            // reliable: true でパケット損失を防止
            conn = peer.connect(remoteId, { reliable: true });
            setupConnectionListeners();
        }

        function setupConnectionListeners() {
            conn.on('open', () => {
                updateStatus(`Connected: ${conn.peer.substring(0,12)}...`, true);
                addLog("接続成功", "success");
            });
            conn.on('data', (data) => {
                if (data.type === 'file-transfer') handleReceiveFile(data);
            });
            conn.on('close', () => {
                updateStatus("Ready for connection", false);
                addLog("デバイスとの接続が終了しました");
            });
            conn.on('error', (err) => {
                addLog("接続に失敗しました", "error");
            });
        }

        function handleFiles(fileList) {
            if (!conn || !conn.open) return addLog("接続が必要です", "error");
            document.getElementById('progress-container').classList.remove('hidden');
            Array.from(fileList).forEach(file => sendFile(file));
        }

        async function sendFile(file) {
            const transferId = 'tx-' + Math.random().toString(36).substr(2, 9);
            createProgressCard(transferId, file.name);

            const reader = new FileReader();
            reader.onload = (e) => {
                updateProgressCard(transferId, 100, "Sending...");
                try {
                    conn.send({
                        type: 'file-transfer',
                        file: e.target.result,
                        fileName: file.name,
                        fileType: file.type
                    });
                    addLog(`${file.name} を送信`, "success");
                } catch (err) {
                    addLog("送信に失敗しました", "error");
                }
                setTimeout(() => removeProgressCard(transferId), 1500);
            };
            reader.readAsArrayBuffer(file);
        }

        function handleReceiveFile(data) {
            const blob = new Blob([data.file], { type: data.fileType });
            const url = URL.createObjectURL(blob);
            addLog(`${data.fileName} を受信`, "success");
            showPreview(url, data.fileName, data.fileType);
            const a = document.createElement('a');
            a.href = url; a.download = data.fileName; a.click();
        }

        function updateStatus(text, isActive) {
            const el = document.getElementById('connection-status');
            const section = document.getElementById('transfer-section');
            el.innerText = text;
            el.classList.toggle('text-green-500', isActive);
            if (isActive) {
                section.classList.remove('hidden');
                setTimeout(() => section.classList.remove('opacity-0', 'scale-95'), 10);
            } else {
                section.classList.add('opacity-0', 'scale-95');
                setTimeout(() => section.classList.add('hidden'), 500);
            }
        }

        function createProgressCard(id, name) {
            const html = `
                <div id="${id}" class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm animate-in fade-in slide-in-from-top-4">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-black truncate max-w-[150px] text-slate-700">${name}</span>
                        <span id="${id}-percent" class="text-[10px] font-bold text-blue-600">Preparing...</span>
                    </div>
                    <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div id="${id}-bar" class="progress-fill h-full transition-all duration-300" style="width: 5%"></div>
                    </div>
                </div>`;
            document.getElementById('active-transfers').insertAdjacentHTML('beforeend', html);
        }

        function updateProgressCard(id, percent, status) {
            const bar = document.getElementById(`${id}-bar`);
            const pct = document.getElementById(`${id}-percent`);
            if (bar) bar.style.width = percent + '%';
            if (pct) pct.innerText = status || percent + '%';
        }

        function removeProgressCard(id) {
            const el = document.getElementById(id);
            if (el) { el.classList.add('opacity-0', 'translate-x-4'); setTimeout(() => el.remove(), 400); }
        }

        function addLog(msg, type = "info") {
            const container = document.getElementById('logs');
            const empty = document.getElementById('empty-log');
            if (empty) empty.remove();
            
            const div = document.createElement('div');
            const colors = { info: "bg-slate-50", error: "bg-red-50 text-red-600 border-red-100", success: "bg-blue-50 text-blue-600 border-blue-100" };
            div.className = `p-3 rounded-xl text-[10px] font-bold border transition-all animate-in slide-in-from-left-4 ${colors[type] || colors.info}`;
            div.innerHTML = `<span class="opacity-40 mr-2">${new Date().toLocaleTimeString()}</span> ${msg}`;
            container.prepend(div);
        }

        function showMyQR() { document.getElementById('qr-modal').classList.remove('hidden'); document.getElementById('qr-modal').classList.add('flex'); }
        function closeQRModal() { document.getElementById('qr-modal').classList.add('hidden'); }
        function openScanner() {
            document.getElementById('scanner-modal').classList.remove('hidden');
            document.getElementById('scanner-modal').classList.add('flex');
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (txt) => {
                document.getElementById('remote-peer-id').value = txt;
                closeScanner();
                connectToPeer(txt);
            }).catch(err => {
                addLog("カメラの起動に失敗しました", "error");
                closeScanner();
            });
        }
        function closeScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById('scanner-modal').classList.add('hidden');
                    document.getElementById('scanner-modal').classList.remove('flex');
                });
            } else {
                document.getElementById('scanner-modal').classList.add('hidden');
                document.getElementById('scanner-modal').classList.remove('flex');
            }
        }

        function showPreview(url, name, type) {
            const modal = document.getElementById('preview-modal');
            document.getElementById('preview-filename').innerText = name;
            document.getElementById('preview-content').innerHTML = type.startsWith('image/') 
                ? `<img src="${url}" class="max-h-full object-contain">`
                : `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/></svg>`;
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.add('opacity-100', 'flex'); modal.querySelector('div').classList.remove('scale-90'); }, 10);
        }
        function closePreview() {
            const modal = document.getElementById('preview-modal');
            modal.querySelector('div').classList.add('scale-90');
            modal.classList.remove('opacity-100');
            setTimeout(() => modal.classList.add('hidden'), 500);
        }

        function copyMyId() {
            const id = document.getElementById('my-peer-id').innerText;
            if (id === "...") return;
            // LINEなどの制限された環境向けのフォールバック
            if (!navigator.clipboard) {
                const textArea = document.createElement("textarea");
                textArea.value = id;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                addLog("IDをコピーしました", "success");
            } else {
                navigator.clipboard.writeText(id).then(() => {
                    addLog("IDをコピーしました", "success");
                });
            }
        }

        function clearLogs() { document.getElementById('logs').innerHTML = '<div id="empty-log" class="h-32 flex items-center justify-center text-slate-300 text-xs italic font-medium">No recent activity</div>'; }
        
        function goToLogin() { 
            // 現在のURLを取得し、リダイレクト先として渡す
            const currentUrl = window.location.origin + window.location.pathname;
            window.location.href = `${AUTH_WORKER_URL}?redirect=${encodeURIComponent(currentUrl)}`; 
        }
        
        function logout() { localStorage.removeItem('noppo_token'); location.reload(); }

        const dz = document.getElementById('drop-zone');
        dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('active'); });
        dz.addEventListener('dragleave', () => dz.classList.remove('active'));
        dz.addEventListener('drop', (e) => { e.preventDefault(); dz.classList.remove('active'); handleFiles(e.dataTransfer.files); });
        document.getElementById('file-input').addEventListener('change', (e) => handleFiles(e.target.files));

        window.onload = checkAuth;
    </script>
</body>
</html>
