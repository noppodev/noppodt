<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noppo Direct Transfer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap');
        
        :root {
            --noppo-blue: #0066FF;
            --noppo-bg: #F8FAFC;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--noppo-bg);
            color: #0F172A;
            letter-spacing: -0.025em;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 102, 255, 0.03) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 102, 255, 0.03) 0px, transparent 50%);
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        header {
            background: rgba(248, 250, 252, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .n-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 12px 40px rgba(0, 40, 120, 0.04);
            border-radius: 32px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .n-input {
            background: rgba(241, 245, 249, 0.7);
            border: 2px solid transparent;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .n-input:focus {
            background: #FFFFFF;
            border-color: var(--noppo-blue);
            box-shadow: 0 0 0 4px rgba(0, 102, 255, 0.08);
        }

        .btn-primary {
            background: var(--noppo-blue);
            color: white;
            border-radius: 20px;
            font-weight: 800;
            box-shadow: 0 12px 24px -6px rgba(0, 102, 255, 0.35);
            transition: all 0.3s ease;
        }

        .btn-primary:disabled {
            background: #CBD5E1;
            box-shadow: none;
            cursor: not-allowed;
        }

        .drop-zone {
            border: 2px dashed #E2E8F0;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 32px;
            transition: all 0.3s ease;
        }

        .drop-zone.active {
            border-color: var(--noppo-blue);
            background: rgba(0, 102, 255, 0.05);
        }

        .drop-zone.disabled {
            opacity: 0.6;
            filter: grayscale(1);
            cursor: not-allowed;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0066FF, #60A5FA);
            width: 0%;
            transition: width 0.1s linear;
            border-radius: 100px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="sticky top-0 z-[60] px-4 sm:px-8 py-4 sm:py-5">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-11 h-11 bg-[#0066FF] rounded-2xl flex items-center justify-center text-white shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tighter leading-none mb-1">Noppo <span class="text-[#0066FF]">DT</span></h1>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest opacity-80">Hyper Transfer</p>
                </div>
            </div>

            <div class="flex items-center gap-3 sm:gap-6">
                <div class="hidden sm:block text-right">
                    <p id="user-name" class="text-sm font-extrabold text-slate-800">Guest</p>
                    <div class="flex items-center justify-end gap-1.5">
                        <div id="auth-indicator" class="w-1.5 h-1.5 rounded-full bg-slate-300"></div>
                        <p id="user-status" class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Offline</p>
                    </div>
                </div>
                <button id="auth-btn" onclick="handleAuthAction()" class="bg-slate-900 text-white px-5 py-2.5 rounded-xl text-[11px] font-black hover:bg-black transition-all active:scale-95">
                    ログイン
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto w-full p-4 sm:p-8 flex-grow">
        <section class="mb-10 text-center animate-up">
            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-4">Device Identity</h3>
            <div class="inline-flex flex-col sm:flex-row items-center gap-4 px-8 py-5 bg-white/80 rounded-[32px] shadow-sm border border-white w-full sm:w-auto">
                <div id="my-peer-id" class="mono text-lg sm:text-xl font-bold text-slate-800 tracking-tight break-all">Initializing...</div>
                <div class="flex gap-4 border-t sm:border-t-0 sm:border-l border-slate-100 pt-4 sm:pt-0 sm:pl-4">
                    <button onclick="copyId()" class="p-2 text-slate-400 hover:text-blue-600 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                    </button>
                    <button onclick="showQR()" class="p-2 text-slate-400 hover:text-blue-600 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/></svg>
                    </button>
                </div>
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 sm:gap-8 mb-12">
            <div class="n-card p-6 sm:p-10 animate-up" style="animation-delay: 0.1s">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.25em]">Connect</h3>
                    <div id="conn-status" class="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-full">
                        <div id="status-dot" class="w-2 h-2 rounded-full bg-slate-300"></div>
                        <span id="status-text" class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Waiting</span>
                    </div>
                </div>
                <div class="space-y-5">
                    <div class="relative">
                        <input type="text" id="target-id" placeholder="相手のIDを入力" class="n-input w-full px-6 py-4 text-sm outline-none">
                        <button onclick="openScan()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-blue-600 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 7h1"/><path d="M7 12h10"/><path d="M7 17h10"/><path d="M12 7h5"/></svg>
                        </button>
                    </div>
                    <button id="conn-btn" onclick="startConnect()" class="btn-primary w-full py-4 text-xs uppercase tracking-widest">
                        Connect Device
                    </button>
                </div>
            </div>

            <div id="drop-zone" class="n-card p-3 drop-zone disabled animate-up" style="animation-delay: 0.2s">
                <div class="bg-white/40 border border-white/60 rounded-[30px] h-full p-6 sm:p-10 flex flex-col items-center justify-center text-center gap-5">
                    <div id="drop-icon" class="w-16 h-16 bg-white rounded-2xl flex items-center justify-center text-slate-200 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                    </div>
                    <div>
                        <h2 id="drop-title" class="text-lg font-extrabold mb-1 tracking-tight">デバイス未接続</h2>
                        <p id="drop-desc" class="text-slate-400 text-[10px] font-medium leading-relaxed max-w-[200px]">ファイルを送信するには先にデバイスを接続してください</p>
                    </div>
                    <input type="file" id="file-input" class="hidden" multiple disabled>
                    <button id="file-btn" onclick="document.getElementById('file-input').click()" disabled class="bg-slate-300 text-white px-8 py-3 rounded-2xl font-black text-[10px] uppercase tracking-widest transition-all cursor-not-allowed">
                        Select Files
                    </button>
                </div>
            </div>
        </div>

        <section class="animate-up" style="animation-delay: 0.3s">
            <div class="flex justify-between items-center mb-6 px-4">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em]">Transfer Queue</h3>
                <button onclick="clearLogs()" class="text-[10px] font-black text-slate-300 hover:text-blue-600 transition-colors uppercase tracking-widest">Clear All</button>
            </div>
            <div id="transfer-list" class="space-y-4">
                <div id="empty-hint" class="py-20 text-center border-2 border-dashed border-slate-100 rounded-[40px] bg-white/30">
                    <p class="text-[10px] font-black text-slate-300 uppercase tracking-[0.4em]">No active transfers</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="p-10 text-center opacity-20">
        <p class="text-[9px] font-black uppercase tracking-[0.5em] text-slate-400">Direct-Peer Encryption Enabled</p>
    </footer>

    <div id="modal-qr" class="fixed inset-0 bg-slate-900/10 backdrop-blur-2xl z-[100] hidden items-center justify-center p-6" onclick="closeModal('modal-qr')">
        <div class="bg-white rounded-[48px] p-10 max-w-sm w-full shadow-2xl animate-up" onclick="event.stopPropagation()">
            <div class="flex flex-col items-center text-center">
                <h4 class="font-black text-xl mb-3 tracking-tight">Connect via QR</h4>
                <p class="text-[11px] text-slate-400 mb-8">カメラでスキャンして瞬時にリンク</p>
                <div id="qrcode" class="p-6 bg-slate-50 rounded-[32px] mb-8 border border-slate-100"></div>
                <button onclick="closeModal('modal-qr')" class="w-full btn-primary py-4 text-xs uppercase tracking-widest">Close</button>
            </div>
        </div>
    </div>

    <div id="modal-scan" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-[100] hidden flex-col items-center justify-center p-6" onclick="closeScan()">
        <div id="reader" class="w-full max-w-md aspect-square overflow-hidden rounded-[40px] border-2 border-white/10"></div>
        <button onclick="closeScan()" class="mt-8 bg-white/10 text-white px-10 py-3 rounded-2xl font-black text-[10px] uppercase tracking-widest border border-white/20">Cancel</button>
    </div>

    <script>
        const AUTH_WORKER = "https://noppo-auth.noppo5319.workers.dev";
        const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2YXZhc3JkeGd1cWtpaWdjeGtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0MTk5ODcsImV4cCI6MjA4Mjk5NTk4N30.CVq3lyRbxek7Ejs4tP5sN9-0JNEXSLtCsC2Pj-skFFQ";
        
        const CHUNK_SIZE = 16384 * 4; // 64KB (WebRTCで安定して送れるサイズ)
        let peer = null;
        let activeConn = null;
        let currentUser = null;
        let receivingFiles = {};
        let qrScanner = null;

        async function loadUser() {
            const ticket = new URLSearchParams(window.location.search).get('ticket');
            const cached = localStorage.getItem('noppo_user');
            if (cached) currentUser = JSON.parse(cached);

            try {
                const url = ticket ? `${AUTH_WORKER}/auth/v1/user?ticket=${ticket}` : `${AUTH_WORKER}/auth/v1/user`;
                const res = await fetch(url, { headers: { "apikey": API_KEY } });
                if (res.ok) {
                    currentUser = await res.json();
                    localStorage.setItem('noppo_user', JSON.stringify(currentUser));
                    if (ticket) history.replaceState({}, "", window.location.origin + window.location.pathname);
                }
            } catch (e) {}

            const name = currentUser ? (currentUser.user_metadata?.display_name || currentUser.email.split('@')[0]) : null;
            updateUserUI(name || "Guest", !!currentUser);
            setupPeer(name);
        }

        function updateUserUI(name, loggedIn) {
            document.getElementById('user-name').innerText = name;
            document.getElementById('user-status').innerText = loggedIn ? 'Authorized' : 'Offline';
            document.getElementById('auth-btn').innerText = loggedIn ? 'ログアウト' : 'ログイン';
            document.getElementById('auth-indicator').className = `w-1.5 h-1.5 rounded-full ${loggedIn ? 'bg-blue-500' : 'bg-slate-300'}`;
        }

        function handleAuthAction() {
            if (currentUser) {
                localStorage.removeItem('noppo_user');
                window.location.href = `${AUTH_WORKER}/logout?redirect=${encodeURIComponent(window.location.href)}`;
            } else {
                window.location.href = `${AUTH_WORKER}?redirect=${encodeURIComponent(window.location.href)}`;
            }
        }

        function setupPeer(name, suffix = "") {
            const id = name ? `noppo-${name}${suffix}`.toLowerCase().replace(/[^a-z0-9-]/g, '') : null;
            if (peer) peer.destroy();
            
            peer = new Peer(id, {
                debug: 1,
                config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] }
            });

            peer.on('open', id => {
                document.getElementById('my-peer-id').innerText = id;
                generateQR(id);
                updateConnStatus("Ready", false);
            });

            peer.on('connection', conn => {
                activeConn = conn;
                handleConnection(conn);
            });

            peer.on('error', err => {
                console.error('Peer error:', err);
                if (err.type === 'unavailable-id') setupPeer(name, "-" + Math.floor(Math.random() * 9000));
                if (err.type === 'peer-unavailable') {
                    alert('相手が見つかりませんでした。IDを確認してください。');
                    updateConnStatus("Ready", false);
                }
            });
        }

        function startConnect() {
            const tid = document.getElementById('target-id').value.trim();
            if (!tid || !peer || !peer.open) return;
            
            updateConnStatus("Connecting", true);
            const conn = peer.connect(tid, { reliable: true });
            activeConn = conn;
            handleConnection(conn);
        }

        function handleConnection(conn) {
            conn.on('open', () => {
                updateConnStatus(`Linked`, true);
                enableTransferUI(true);
            });

            conn.on('data', data => {
                if (data.type === 'file-start') {
                    receivingFiles[data.fileId] = { chunks: [], total: data.totalChunks, received: 0, name: data.name, mime: data.mime };
                    addProgressUI(data.fileId, data.name, 'receiving');
                } else if (data.type === 'file-chunk') {
                    const info = receivingFiles[data.fileId];
                    if (!info) return;
                    info.chunks[data.index] = data.chunk;
                    info.received++;
                    
                    if (info.received % 10 === 0 || info.received === info.total) {
                        const pct = Math.floor((info.received / info.total) * 100);
                        updateProgressUI(data.fileId, pct, `${pct}%`);
                    }
                    if (info.received === info.total) finalizeDownload(data.fileId);
                }
            });

            conn.on('close', () => {
                updateConnStatus("Disconnected", false);
                enableTransferUI(false);
                activeConn = null;
            });
        }

        function enableTransferUI(enabled) {
            const dz = document.getElementById('drop-zone');
            const input = document.getElementById('file-input');
            const btn = document.getElementById('file-btn');
            const title = document.getElementById('drop-title');
            const desc = document.getElementById('drop-desc');
            const icon = document.getElementById('drop-icon');

            if (enabled) {
                dz.classList.remove('disabled');
                input.disabled = false;
                btn.disabled = false;
                btn.className = "bg-slate-900 text-white px-8 py-3 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-black transition-all active:scale-95 shadow-lg";
                title.innerText = "Drop & Send";
                desc.innerText = "ファイルをここにドロップして送信";
                icon.className = "w-16 h-16 bg-white rounded-2xl flex items-center justify-center text-blue-500 shadow-sm";
            } else {
                dz.classList.add('disabled');
                input.disabled = true;
                btn.disabled = true;
                btn.className = "bg-slate-300 text-white px-8 py-3 rounded-2xl font-black text-[10px] uppercase tracking-widest cursor-not-allowed";
                title.innerText = "デバイス未接続";
                desc.innerText = "ファイルを送信するには先にデバイスを接続してください";
                icon.className = "w-16 h-16 bg-white rounded-2xl flex items-center justify-center text-slate-200 shadow-sm";
            }
        }

        async function sendFiles(files) {
            if (!activeConn || !activeConn.open) return;
            for (const file of files) {
                const fileId = 'f' + Math.random().toString(36).substr(2, 9);
                const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
                addProgressUI(fileId, file.name, 'sending');
                activeConn.send({ type: 'file-start', fileId, name: file.name, mime: file.type, totalChunks });

                for (let i = 0; i < totalChunks; i++) {
                    const chunk = await file.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE).arrayBuffer();
                    activeConn.send({ type: 'file-chunk', fileId, index: i, chunk });
                    
                    if (i % 10 === 0 || i === totalChunks - 1) {
                        const pct = Math.floor(((i + 1) / totalChunks) * 100);
                        updateProgressUI(fileId, pct, `${pct}%`);
                    }
                    if (i % 20 === 0) await new Promise(r => setTimeout(r, 0)); 
                }
                updateProgressUI(fileId, 100, "Done");
            }
        }

        function finalizeDownload(fileId) {
            const info = receivingFiles[fileId];
            const blob = new Blob(info.chunks, { type: info.mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = info.name;
            a.click();
            updateProgressUI(fileId, 100, "Saved");
            delete receivingFiles[fileId];
        }

        function updateConnStatus(text, active) {
            document.getElementById('status-text').innerText = text;
            document.getElementById('status-dot').className = `w-2 h-2 rounded-full ${active ? 'bg-blue-500 animate-pulse' : 'bg-slate-300'}`;
        }

        function addProgressUI(id, name, mode) {
            const hint = document.getElementById('empty-hint');
            if (hint) hint.remove();
            const html = `
                <div id="${id}" class="n-card p-6 animate-up">
                    <div class="flex justify-between items-center mb-4">
                        <div class="flex items-center gap-4 overflow-hidden">
                            <div class="w-10 h-10 shrink-0 rounded-xl ${mode === 'sending' ? 'bg-blue-50 text-blue-500' : 'bg-emerald-50 text-emerald-500'} flex items-center justify-center">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="${mode === 'sending' ? 'm5 12 7-7 7 7M12 19V5' : 'm19 12-7 7-7-7M12 5v14'}"/></svg>
                            </div>
                            <div class="min-w-0">
                                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">${mode === 'sending' ? 'Sending' : 'Receiving'}</p>
                                <p class="text-xs font-bold text-slate-700 truncate">${name}</p>
                            </div>
                        </div>
                        <span id="${id}-stat" class="shrink-0 text-[9px] font-black text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg">Wait</span>
                    </div>
                    <div class="h-1.5 w-full bg-slate-100 rounded-full overflow-hidden"><div id="${id}-bar" class="progress-fill"></div></div>
                </div>`;
            document.getElementById('transfer-list').insertAdjacentHTML('afterbegin', html);
        }

        function updateProgressUI(id, pct, text) {
            const bar = document.getElementById(`${id}-bar`);
            const stat = document.getElementById(`${id}-stat`);
            if (bar) bar.style.width = pct + '%';
            if (stat) stat.innerText = text;
        }

        function generateQR(text) {
            const el = document.getElementById("qrcode");
            el.innerHTML = "";
            new QRCode(el, { text, width: 200, height: 200, colorDark: "#0f172a", correctLevel: QRCode.CorrectLevel.M });
        }

        function showQR() { document.getElementById('modal-qr').classList.replace('hidden', 'flex'); }
        function closeModal(id) { document.getElementById(id).classList.replace('flex', 'hidden'); }
        function copyId() { navigator.clipboard.writeText(document.getElementById('my-peer-id').innerText); }
        function clearLogs() { 
            const list = document.getElementById('transfer-list');
            list.innerHTML = `<div id="empty-hint" class="py-20 text-center border-2 border-dashed border-slate-100 rounded-[40px] bg-white/30">
                <p class="text-[10px] font-black text-slate-300 uppercase tracking-[0.4em]">No active transfers</p>
            </div>`;
        }

        function openScan() {
            document.getElementById('modal-scan').classList.replace('hidden', 'flex');
            qrScanner = new Html5Qrcode("reader");
            qrScanner.start({ facingMode: "environment" }, { fps: 24, qrbox: 250 }, (text) => {
                document.getElementById('target-id').value = text;
                closeScan();
                startConnect();
            }).catch(() => {});
        }

        function closeScan() {
            if (qrScanner) {
                qrScanner.stop().finally(() => {
                    document.getElementById('modal-scan').classList.replace('flex', 'hidden');
                    qrScanner = null;
                });
            } else {
                document.getElementById('modal-scan').classList.replace('flex', 'hidden');
            }
        }

        const dz = document.getElementById('drop-zone');
        dz.ondragover = e => { 
            e.preventDefault(); 
            if (activeConn?.open) dz.classList.add('active'); 
        };
        dz.ondragleave = () => dz.classList.remove('active');
        dz.ondrop = e => { 
            e.preventDefault(); 
            dz.classList.remove('active');
            if (activeConn?.open) sendFiles(e.dataTransfer.files);
        };
        document.getElementById('file-input').onchange = e => sendFiles(e.target.files);

        window.onload = loadUser;
    </script>
</body>
</html>
