<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noppo Direct Transfer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        .drop-zone {
            border: 2px dashed #cbd5e1;
            transition: all 0.3s ease;
        }
        .drop-zone.active {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">

    <!-- Header -->
    <header class="bg-white border-b px-6 py-4 flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-bold text-blue-600 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 13 5.23 3.48a2 2 0 0 1 0 3.32L16 23.27a2 2 0 0 1-3-1.66V18.73a2 2 0 0 1 3-1.66Z"/><path d="M21 13V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8"/><path d="M7 8h10"/><path d="M7 12h10"/><path d="M7 16h4"/></svg>
            Noppo Direct Transfer
        </h1>
        <div id="auth-status" class="text-sm flex items-center gap-3">
            <span id="user-display-name" class="text-slate-500 font-medium">ゲスト</span>
            <button id="login-btn" onclick="goToLogin()" class="bg-blue-600 text-white px-4 py-1.5 rounded-full hover:bg-blue-700 transition">Noppoログイン</button>
            <button id="logout-btn" onclick="logout()" class="hidden text-slate-400 hover:text-red-500">ログアウト</button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6 space-y-8">
        <!-- Connection Panel -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- My ID -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-sm font-semibold text-slate-400 mb-2 uppercase tracking-wider">あなたの転送ID</h2>
                <div class="flex items-center gap-2">
                    <code id="my-peer-id" class="text-2xl font-mono font-bold text-slate-700">準備中...</code>
                    <button onclick="copyMyId()" class="p-2 hover:bg-slate-100 rounded-lg text-slate-400 transition" title="コピー">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                    </button>
                </div>
                <p class="text-xs text-slate-400 mt-2">ファイルを送る相手にこのIDを伝えてください。</p>
            </div>

            <!-- Connect to Someone -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-sm font-semibold text-slate-400 mb-2 uppercase tracking-wider">相手に接続する</h2>
                <div class="flex gap-2">
                    <input type="text" id="remote-peer-id" placeholder="相手のIDを入力..." class="flex-1 px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="connect-btn" onclick="connectToPeer()" class="bg-slate-800 text-white px-6 py-2 rounded-xl hover:bg-slate-900 transition">接続</button>
                </div>
                <div id="connection-status" class="mt-2 text-xs font-medium text-slate-400">未接続</div>
            </div>
        </section>

        <!-- Transfer Area -->
        <section id="transfer-section" class="hidden opacity-50 pointer-events-none transition-opacity duration-500">
            <div id="drop-zone" class="drop-zone bg-white rounded-3xl p-12 flex flex-col items-center justify-center space-y-4">
                <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                </div>
                <div class="text-center">
                    <p class="text-lg font-semibold">ここにファイルをドロップ</p>
                    <p class="text-slate-400 text-sm">または、ファイルを選択してください</p>
                </div>
                <input type="file" id="file-input" class="hidden">
                <button onclick="document.getElementById('file-input').click()" class="px-6 py-2 border border-slate-200 rounded-full hover:bg-slate-50 transition">ファイルを選択</button>
            </div>
        </section>

        <!-- Progress/Logs -->
        <section id="log-section" class="space-y-3">
            <h3 class="text-sm font-semibold text-slate-400 uppercase">アクティビティ</h3>
            <div id="logs" class="space-y-2">
                <div class="bg-slate-100 p-3 rounded-lg text-sm text-slate-500 text-center">まだログはありません</div>
            </div>
        </section>
    </main>

    <script>
        // Noppo Auth Settings
        const AUTH_WORKER_URL = "https://noppo-auth.noppo5319.workers.dev";
        const SUPABASE_URL = "https://vvavasrdxguqkiigcxkl.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2YXZhc3JkeGd1cWtpaWdjeGtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0MTk5ODcsImV4cCI6MjA4Mjk5NTk4N30.CVq3lyRbxek7Ejs4tP5sN9-0JNEXSLtCsC2Pj-skFFQ";

        // PeerJS & Transfer State
        let peer = null;
        let conn = null;

        // 1. Noppo Auth Functions
        function goToLogin() {
            const currentUrl = encodeURIComponent(window.location.href);
            window.location.href = `${AUTH_WORKER_URL}?redirect=${currentUrl}`;
        }

        function logout() {
            localStorage.removeItem('noppo_token');
            location.reload();
        }

        async function checkAuth() {
            const params = new URLSearchParams(window.location.search);
            const tokenFromUrl = params.get('token');
            
            if (tokenFromUrl) {
                localStorage.setItem('noppo_token', tokenFromUrl);
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            const token = localStorage.getItem('noppo_token');
            if (token) {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    headers: { "Authorization": `Bearer ${token}`, "apikey": SUPABASE_KEY }
                });
                if (response.ok) {
                    const user = await response.json();
                    
                    // メールアドレスの@より前を抽出して表示
                    const userName = user.email.split('@')[0];
                    document.getElementById('user-display-name').innerText = userName;
                    
                    document.getElementById('login-btn').classList.add('hidden');
                    document.getElementById('logout-btn').classList.remove('hidden');
                    initPeer(user.id);
                    return;
                }
            }
            initPeer(null);
        }

        // 2. Peer Communication
        function initPeer(id) {
            const peerId = id ? `noppo-${id.substring(0, 8)}` : null;
            peer = new Peer(peerId);

            peer.on('open', (id) => {
                document.getElementById('my-peer-id').innerText = id;
                addLog("転送システムがオンラインになりました");
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnectionListeners();
                updateStatus("接続済み: " + conn.peer, true);
            });

            peer.on('error', (err) => {
                console.error(err);
                addLog("エラー: " + err.type, "error");
            });
        }

        function connectToPeer() {
            const remoteId = document.getElementById('remote-peer-id').value;
            if (!remoteId) return;

            addLog("相手を探しています...");
            conn = peer.connect(remoteId);
            setupConnectionListeners();
        }

        function setupConnectionListeners() {
            conn.on('open', () => {
                updateStatus("接続済み: " + conn.peer, true);
                addLog("接続が確立されました！ファイルを送れます。");
            });

            conn.on('data', (data) => {
                if (data.type === 'file-transfer') {
                    handleReceiveFile(data);
                }
            });

            conn.on('close', () => {
                updateStatus("切断されました", false);
                addLog("接続が切れました。");
            });
        }

        function updateStatus(text, isActive) {
            const statusEl = document.getElementById('connection-status');
            const sectionEl = document.getElementById('transfer-section');
            statusEl.innerText = text;
            statusEl.className = isActive ? "mt-2 text-xs font-bold text-green-500" : "mt-2 text-xs font-medium text-slate-400";
            
            if (isActive) {
                sectionEl.classList.remove('hidden', 'opacity-50', 'pointer-events-none');
            } else {
                sectionEl.classList.add('opacity-50', 'pointer-events-none');
            }
        }

        // 3. File Transfer Logic
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('active'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('active'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('active');
            const file = e.dataTransfer.files[0];
            if (file) sendFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) sendFile(file);
        });

        function sendFile(file) {
            if (!conn || !conn.open) {
                addLog("相手と接続されていません", "error");
                return;
            }

            addLog(`送信中: ${file.name} (${formatBytes(file.size)})...`);
            
            conn.send({
                type: 'file-transfer',
                file: file,
                fileName: file.name,
                fileType: file.type
            });
            
            addLog(`完了: ${file.name} を送信しました！`, "success");
        }

        function handleReceiveFile(data) {
            const blob = new Blob([data.file], { type: data.fileType });
            const url = URL.createObjectURL(blob);
            
            addLog(`受信完了: ${data.fileName}`, "success");

            const a = document.createElement('a');
            a.href = url;
            a.download = data.fileName;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Helpers
        function addLog(message, type = "info") {
            const logs = document.getElementById('logs');
            const emptyMsg = logs.querySelector('div.text-center');
            if (emptyMsg) emptyMsg.remove();

            const colors = {
                info: "bg-white text-slate-600",
                error: "bg-red-50 text-red-600 border-red-100",
                success: "bg-green-50 text-green-600 border-green-100"
            };

            const div = document.createElement('div');
            div.className = `p-3 rounded-xl text-sm border shadow-sm ${colors[type]}`;
            div.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
            logs.prepend(div);
        }

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        function copyMyId() {
            const id = document.getElementById('my-peer-id').innerText;
            const textarea = document.createElement('textarea');
            textarea.value = id;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            addLog("IDをクリップボードにコピーしました");
        }

        window.onload = checkAuth;
    </script>
</body>
</html>
